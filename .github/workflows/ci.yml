name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec nuxt typecheck
        env:
          # Stub values so module setup has something to work with.
          # Real secrets live in the production env at deploy time.
          NUXT_PUBLIC_SITE_URL: https://memour.uz
          NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NUXT_PUBLIC_SUPABASE_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key

      - name: Build
        run: pnpm build
        env:
          NUXT_PUBLIC_SITE_URL: https://memour.uz
          NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NUXT_PUBLIC_SUPABASE_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key

      # The service-role key is read at runtime (nuxt.config); make sure
      # a build that had it in the environment didn't bake it in.
      - name: No secrets in build output
        run: |
          if grep -rq "stub-service-role-key" .output; then
            echo "SUPABASE_SERVICE_ROLE_KEY ended up in .output"
            exit 1
          fi

  # Every migration applies to a fresh database and passes the linter,
  # so a broken or unsafe migration is caught in the PR, not in prod.
  db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply all migrations to a fresh database
        run: supabase db start

      - name: Lint
        run: supabase db lint --fail-on error

  # Unit tests for the pure logic: tiers, prices, upload window, error
  # codes, file sniffing, bot texts, consents (tests/unit).
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  # Smoke tests of the built app in Chromium against a local Supabase
  # started from this repo's config (tests/e2e). Every SMS / Telegram
  # call the server makes is answered by a mock preloaded into it, so
  # nothing leaves the runner; auth emails land in the stack's Mailpit.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_PORT: '3100'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Postgres, Auth, Storage, REST and Mailpit; the dashboard and the
      # log pipeline aren't needed.
      - name: Start local Supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      # API_URL, ANON_KEY, SERVICE_ROLE_KEY … for the steps below (the
      # local stack's well-known demo keys, not secrets).
      - name: Export the local stack's URL and keys
        run: supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed -E 's/^([A-Z0-9_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NUXT_PUBLIC_SITE_URL: http://localhost:${{ env.E2E_PORT }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ env.ANON_KEY }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
